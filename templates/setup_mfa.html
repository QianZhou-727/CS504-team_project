<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Up MFA | CS504 MFA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card wide">
            <p class="eyebrow">Step 2</p>
            <h1>Set up MFA</h1>
            <p class="lede">Scan this QR code in Microsoft Authenticator or Google Authenticator for <strong>{{ username }}</strong>.</p>

            {% include "_messages.html" ignore missing %}

            <div class="qr-wrap">
                <img src="{{ qr_code }}" alt="Authenticator QR code">
            </div>

            <div class="manual-code">
                <span>Manual setup key</span>
                <code>{{ mfa_secret }}</code>
            </div>

            <a class="button-link" href="{{ url_for('login') }}">Continue to login</a>
        </section>
    </main>
</body>
</html>
