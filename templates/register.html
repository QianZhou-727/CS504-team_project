<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | CS504 MFA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">CS504 MFA System</p>
            <h1>Create account</h1>
            <p class="lede">Register with a password, then connect your authenticator app.</p>

            {% include "_messages.html" ignore missing %}

            <form method="post" class="form">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>

                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>

                <button type="submit">Register</button>
            </form>

            <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </section>
    </main>
</body>
</html>
